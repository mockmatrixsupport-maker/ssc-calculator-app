<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Rank Score Master — Calculate your SSC & Railway exam scores instantly from official answer keys.">
<meta name="theme-color" content="#0f766e">
<title>Rank Score Master</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="stylesheet" href="css/style.css">
<style>
.hero { padding: var(--sp-5) 0 var(--sp-5); text-align: center; }

.hero__icon {
  width: 64px; height: 64px; border-radius: 18px;
  margin: 0 auto var(--sp-3); display: block; object-fit: cover;
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-lg), var(--glow);
}

.hero__eyebrow {
  font-size: 0.66rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-light); margin-bottom: var(--sp-2);
  display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
}
.hero__eyebrow::before, .hero__eyebrow::after { content:''; width: 18px; height: 1px; background: var(--border-strong); }

.hero__title {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 6vw, 2.1rem); font-weight: 700; letter-spacing: -0.02em;
  color: var(--text-primary); line-height: 1.12;
}
.hero__title em { font-style: normal; color: var(--ink-light); display: block; }

/* ── Calculator Buttons (stacked, full width) ── */
.calc-stack { display: flex; flex-direction: column; gap: var(--sp-3); margin-bottom: var(--sp-8); }

.calc-card {
  display: flex; align-items: center; gap: var(--sp-4);
  padding: var(--sp-4); background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--r-lg); text-decoration: none; cursor: pointer;
  transition: all 0.22s var(--ease);
}
.calc-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.calc-card:active { transform: translateY(0); }

.calc-icon {
  width: 46px; height: 46px; border-radius: var(--r-md); object-fit: cover;
  border: 1px solid var(--border-strong); box-shadow: var(--shadow-sm); flex-shrink: 0;
}

.calc-card__body { flex: 1; min-width: 0; }
.calc-card__title { font-family: var(--font-display); font-size: 0.94rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }
.calc-card__sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

.calc-card__arrow {
  width: 30px; height: 30px; border-radius: var(--r-full); background: var(--bg-input);
  border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all var(--dur) var(--ease);
}
.calc-card__arrow svg { width: 15px; height: 15px; color: var(--text-muted); }
.calc-card:hover .calc-card__arrow { border-color: var(--ink); background: var(--ink); }
.calc-card:hover .calc-card__arrow svg { color: #fff; }

.calc-skeleton {
  height: 78px; border-radius: var(--r-lg); border: 1px solid var(--border);
  background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite;
}

/* ── Answer Key Section — dense plain-link list (no nested box) ── */
.answerkey-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-3); }
.answerkey-title { display: flex; align-items: center; gap: var(--sp-2); font-family: var(--font-display); font-size: 0.92rem; font-weight: 700; color: var(--text-primary); }

.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pass); animation: pulse-dot 1.5s ease infinite; flex-shrink: 0; }

.ak-list { display: flex; flex-direction: column; }

.ak-box {
  display: block; padding: 9px 2px;
  border-bottom: 1px solid var(--rule);
  text-decoration: none; transition: background var(--dur) var(--ease);
}
.ak-list .ak-box:last-child { border-bottom: none; }
.ak-box:hover { background: var(--bg-card-hover); }
.ak-box--inactive { opacity: 0.55; }

.ak-box__exam {
  font-size: 0.82rem; font-weight: 500; line-height: 1.35;
  color: var(--ink-light);
  text-decoration: underline; text-decoration-color: rgba(45,212,191,0.35); text-underline-offset: 2px;
}

.ak-view-more {
  display: block; width: 100%; text-align: center; margin-top: var(--sp-3);
  padding: var(--sp-2); border-radius: var(--r-md); border: 1px solid var(--border-strong);
  color: var(--text-secondary); font-size: 0.76rem; font-weight: 600; cursor: pointer;
  transition: all var(--dur) var(--ease); background: var(--bg-input);
}
.ak-view-more:hover { border-color: var(--ink); color: var(--ink-light); background: var(--bg-card-hover); }
.ak-view-more:disabled { opacity: 0.6; cursor: default; }

.ak-skeleton {
  height: 36px; border-radius: var(--r-sm); border: 1px solid var(--border);
  background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite;
  margin-bottom: var(--sp-2);
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.ak-empty { text-align: center; padding: var(--sp-6) var(--sp-4); color: var(--text-muted); font-size: 0.8rem; }

.app-footer { text-align: center; padding: var(--sp-6) var(--sp-4); border-top: 1px solid var(--border); margin-top: var(--sp-8); }
.app-footer p { font-size: 0.7rem; color: var(--text-muted); }
.app-footer a { color: var(--ink-light); }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header__inner">
    <a href="index.html" class="app-logo">
      <img src="logo.jpg" alt="Rank Score Master" class="app-logo__icon">
      <div class="app-logo__text">
        <span class="app-logo__name">Rank Score Master</span>
        <span class="app-logo__tagline">SSC · Railway · Analysis</span>
      </div>
    </a>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
        <svg id="iconDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="iconLight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="page-main">
  <div class="container">

    <section class="hero fade-up">
      <img src="logo.jpg" alt="Rank Score Master" class="hero__icon">
      <p class="hero__eyebrow">Score · Rank · Analyse</p>
      <h1 class="hero__title">Welcome to<br><em>Rank Score Master</em></h1>
    </section>

    <!-- Cards are built from calculators.json — add a new family there
         (e.g. Airforce) and it appears here automatically, no HTML edit. -->
    <div class="calc-stack fade-up fade-up-2" id="calcStack">
      <div class="calc-skeleton"></div>
      <div class="calc-skeleton"></div>
    </div>

    <section class="fade-up fade-up-1">
      <div class="card">
        <div class="answerkey-header">
          <div class="answerkey-title"><div class="live-dot"></div>Latest Answer Keys</div>
        </div>
        <div class="ak-list" id="akList">
          <div class="ak-skeleton"></div>
          <div class="ak-skeleton"></div>
          <div class="ak-skeleton"></div>
          <div class="ak-skeleton"></div>
        </div>
        <button class="ak-view-more hidden" id="akViewMore">View more answer keys</button>
      </div>
    </section>

  </div>
</main>

<footer class="app-footer">
  <p>Rank Score Master &copy; 2026 &nbsp;·&nbsp; For educational use only</p>
</footer>

<script src="js/remote-loader.js?v=1"></script>
<script>
const html = document.documentElement;
const toggleBtn = document.getElementById('themeToggle');
const iconDark = document.getElementById('iconDark');
const iconLight = document.getElementById('iconLight');

function applyTheme(t) {
  html.setAttribute('data-theme', t);
  localStorage.setItem('rsm-theme', t);
  iconDark.classList.toggle('hidden', t !== 'dark');
  iconLight.classList.toggle('hidden', t === 'dark');
}
applyTheme(localStorage.getItem('rsm-theme') || 'light');
toggleBtn.addEventListener('click', () => applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

function loadJSON(path) {
  if (typeof RSMLoader !== 'undefined' && RSMLoader.loadJSON) {
    return RSMLoader.loadJSON(path, path);
  }
  return fetch(path).then(r => r.json());
}

// ── Calculator cards ──────────────────────────────────────────────
function renderCalculatorCards(families) {
  const stack = document.getElementById('calcStack');
  stack.innerHTML = families.map(f => `
    <a href="calculator.html?family=${encodeURIComponent(f.id)}" class="calc-card">
      <img src="${f.logo}" alt="${f.id.toUpperCase()}" class="calc-icon">
      <div class="calc-card__body">
        <div class="calc-card__title">${f.title}</div>
        <div class="calc-card__sub">${f.cardSub}</div>
      </div>
      <div class="calc-card__arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </a>`).join('');
}

function loadCalculatorCards() {
  const stack = document.getElementById('calcStack');
  if (typeof RSMLoader !== 'undefined' && RSMLoader.loadJSONLive) {
    RSMLoader.loadJSONLive('calculators.json', 'calculators', 'calculators.json', (data, fromCache) => {
      renderCalculatorCards(data || []);
    });
  } else {
    fetch('calculators.json').then(r => r.json()).then(renderCalculatorCards).catch(() => {
      stack.innerHTML = '<div class="ak-empty">Could not load calculators.<br>Please try again later.</div>';
    });
  }
}
loadCalculatorCards();

// ── Answer keys: fast "latest" list first, full archive only on demand ──
let latestKeys = [];
let archiveKeys = null;   // null = not fetched yet
let akExpanded = false;

function loadLatestKeys() {
  const list = document.getElementById('akList');
  if (typeof RSMLoader !== 'undefined' && RSMLoader.loadJSONLive) {
    RSMLoader.loadJSONLive('data/answerkeys-latest.json', 'answerkeys-latest', 'data/answerkeys-latest.json', (data, fromCache) => {
      latestKeys = data || [];
      renderAnswerKeys();
      // fromCache=true → this is the instant cached render, no wait.
      // fromCache=false → fresh data just arrived, silently updated.
    });
  } else {
    // RSMLoader unavailable (shouldn't happen) — fall back to a plain fetch.
    fetch('data/answerkeys-latest.json').then(r => r.json()).then(data => {
      latestKeys = data || [];
      renderAnswerKeys();
    }).catch(() => {
      list.innerHTML = '<div class="ak-empty">Could not load answer keys.<br>Please try again later.</div>';
    });
  }
}

function akHref(ak) {
  return `calculator.html?family=${encodeURIComponent(ak.family)}&exam=${encodeURIComponent(ak.examId)}`;
}

function renderAnswerKeys() {
  const list = document.getElementById('akList');
  const viewMoreBtn = document.getElementById('akViewMore');
  const visible = akExpanded ? (archiveKeys || []) : latestKeys;

  if (!visible.length) {
    list.innerHTML = '<div class="ak-empty">No answer keys released yet.<br>Check back on exam day.</div>';
    viewMoreBtn.classList.add('hidden');
    return;
  }

  list.innerHTML = visible.map(ak => {
    const tag = ak.badge ? `<span class="tag-new">(${ak.badge})</span>` : '';
    const inactiveClass = ak.active === false ? 'ak-box--inactive' : '';
    return `
      <a href="${akHref(ak)}" class="ak-box ${inactiveClass}">
        <span class="ak-box__exam">${ak.label}${tag}</span>
      </a>`;
  }).join('');

  viewMoreBtn.classList.remove('hidden');
  viewMoreBtn.disabled = false;
  viewMoreBtn.textContent = akExpanded ? 'Show less' : 'View more answer keys';
}

document.getElementById('akViewMore').addEventListener('click', () => {
  const btn = document.getElementById('akViewMore');
  if (!akExpanded && archiveKeys === null) {
    btn.disabled = true;
    btn.textContent = 'Loading…';
    if (typeof RSMLoader !== 'undefined' && RSMLoader.loadJSONLive) {
      RSMLoader.loadJSONLive('data/answerkeys-archive.json', 'answerkeys-archive', 'data/answerkeys-archive.json', (data) => {
        archiveKeys = data || [];
        akExpanded = true;
        renderAnswerKeys();
      });
      return; // renderAnswerKeys() above already handles both cache+fresh calls
    } else {
      fetch('data/answerkeys-archive.json').then(r => r.json()).then(data => {
        archiveKeys = data || [];
        akExpanded = true;
        renderAnswerKeys();
      }).catch(() => {
        archiveKeys = [];
        akExpanded = true;
        renderAnswerKeys();
      });
      return;
    }
  }
  akExpanded = !akExpanded;
  renderAnswerKeys();
});

loadLatestKeys();

// ── loadCalculatorCards() and loadLatestKeys() now use
// RSMLoader.loadJSONLive() — no manifest.json involved at all. Every
// call shows cached data instantly (if present) and independently
// fetches fresh data directly from jsDelivr in the background,
// updating the screen silently when it arrives. Re-calling them here
// on foreground-return just repeats that same cache-then-refresh
// cycle — not a separate "reset a version check" mechanism anymore.
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') {
    loadCalculatorCards();
    loadLatestKeys();
  }
});
</script>
</body>
</html>
