<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Rank Score Master — Calculate your SSC & Railway exam scores instantly from official answer keys.">
<meta name="theme-color" content="#0f766e">
<title>Rank Score Master</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="stylesheet" href="css/style.css">
<style>
.hero { padding: var(--sp-5) 0 var(--sp-5); text-align: center; }

.hero__icon {
  width: 64px; height: 64px; border-radius: 18px;
  margin: 0 auto var(--sp-3); display: block; object-fit: cover;
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-lg), var(--glow);
}

.hero__eyebrow {
  font-size: 0.66rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-light); margin-bottom: var(--sp-2);
  display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
}
.hero__eyebrow::before, .hero__eyebrow::after { content:''; width: 18px; height: 1px; background: var(--border-strong); }

.hero__title {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 6vw, 2.1rem); font-weight: 700; letter-spacing: -0.02em;
  color: var(--text-primary); line-height: 1.12;
}
.hero__title em { font-style: normal; color: var(--ink-light); display: block; }

/* ── Calculator Cards (compact, one row) ── */
.calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); margin-bottom: var(--sp-7); }

.calc-card {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: var(--sp-4) var(--sp-3); background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--r-lg); text-decoration: none; cursor: pointer;
  transition: all 0.22s var(--ease); gap: var(--sp-2); position: relative;
}
.calc-card:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: var(--shadow-md); }
.calc-card:active { transform: translateY(0); }

.calc-icon {
  width: 40px; height: 40px; border-radius: var(--r-md); object-fit: cover;
  border: 1px solid var(--border-strong); box-shadow: var(--shadow-sm);
}

.calc-card__title { font-family: var(--font-display); font-size: 0.86rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; line-height: 1.25; }
.calc-card__sub { font-size: 0.64rem; color: var(--text-muted); line-height: 1.4; }

/* ── Answer Key Section — link list ── */
.answerkey-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-4); }
.answerkey-title { display: flex; align-items: center; gap: var(--sp-2); font-family: var(--font-display); font-size: 0.92rem; font-weight: 700; color: var(--text-primary); }

.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pass); animation: pulse-dot 1.5s ease infinite; flex-shrink: 0; }

.ak-list { display: flex; flex-direction: column; }

.ak-row {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-3) 0; border-bottom: 1px solid var(--rule);
  text-decoration: none; transition: opacity var(--dur) var(--ease);
}
.ak-row:last-child { border-bottom: none; }
.ak-row:hover { opacity: 0.75; }
.ak-row--inactive { opacity: 0.45; pointer-events: none; }

.ak-row__link {
  flex: 1; min-width: 0; font-size: 0.8rem; font-weight: 600;
  color: var(--ink-light); text-decoration: underline; text-decoration-color: rgba(45,212,191,0.35);
  text-underline-offset: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
[data-theme="light"] .ak-row__link { color: var(--ink); text-decoration-color: rgba(15,118,110,0.3); }

.ak-row__badges { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

.ak-view-more {
  display: block; text-align: center; margin-top: var(--sp-4);
  padding: var(--sp-2); border-radius: var(--r-md); border: 1px dashed var(--border-strong);
  color: var(--text-secondary); font-size: 0.74rem; font-weight: 600; cursor: pointer;
  transition: all var(--dur) var(--ease); background: transparent;
}
.ak-view-more:hover { border-color: var(--ink); color: var(--ink-light); }

.ak-skeleton {
  height: 36px; border-radius: var(--r-sm); border-bottom: 1px solid var(--rule);
  background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.ak-empty { text-align: center; padding: var(--sp-6) var(--sp-4); color: var(--text-muted); font-size: 0.8rem; }

.app-footer { text-align: center; padding: var(--sp-6) var(--sp-4); border-top: 1px solid var(--border); margin-top: var(--sp-8); }
.app-footer p { font-size: 0.7rem; color: var(--text-muted); }
.app-footer a { color: var(--ink-light); }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header__inner">
    <a href="index.html" class="app-logo">
      <img src="logo.jpg" alt="Rank Score Master" class="app-logo__icon">
      <div class="app-logo__text">
        <span class="app-logo__name">Rank Score Master</span>
        <span class="app-logo__tagline">SSC · Railway · Analysis</span>
      </div>
    </a>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
        <svg id="iconDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="iconLight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="page-main">
  <div class="container">

    <section class="hero fade-up">
      <img src="logo.jpg" alt="Rank Score Master" class="hero__icon">
      <p class="hero__eyebrow">Score · Rank · Analyse</p>
      <h1 class="hero__title">Welcome to<br><em>Rank Score Master</em></h1>
    </section>

    <section class="fade-up fade-up-1">
      <div class="card">
        <div class="answerkey-header">
          <div class="answerkey-title"><div class="live-dot"></div>Latest Answer Keys</div>
        </div>
        <div class="ak-list" id="akList">
          <div class="ak-skeleton"></div>
          <div class="ak-skeleton"></div>
          <div class="ak-skeleton"></div>
          <div class="ak-skeleton"></div>
        </div>
        <button class="ak-view-more hidden" id="akViewMore">View more answer keys</button>
      </div>
    </section>

    <div class="calc-grid fade-up fade-up-2">
      <a href="ssc-calculator.html" class="calc-card">
        <img src="ssc-logo.jpg" alt="SSC" class="calc-icon">
        <div>
          <div class="calc-card__title">SSC Exams<br>Calculator</div>
          <div class="calc-card__sub">CGL · CHSL · GD · CPO · MTS</div>
        </div>
      </a>

      <a href="rrb-calculator.html" class="calc-card">
        <img src="railway-logo.jpg" alt="Railway" class="calc-icon">
        <div>
          <div class="calc-card__title">Railway Exams<br>Calculator</div>
          <div class="calc-card__sub">NTPC · Group D · ALP · JE</div>
        </div>
      </a>
    </div>

  </div>
</main>

<footer class="app-footer">
  <p>Rank Score Master &copy; 2026 &nbsp;·&nbsp; <a href="#">MockMatrix</a> &nbsp;·&nbsp; For educational use only</p>
</footer>

<script>
const html = document.documentElement;
const toggleBtn = document.getElementById('themeToggle');
const iconDark = document.getElementById('iconDark');
const iconLight = document.getElementById('iconLight');

function applyTheme(t) {
  html.setAttribute('data-theme', t);
  localStorage.setItem('rsm-theme', t);
  iconDark.classList.toggle('hidden', t !== 'dark');
  iconLight.classList.toggle('hidden', t === 'dark');
}
applyTheme(localStorage.getItem('rsm-theme') || 'dark');
toggleBtn.addEventListener('click', () => applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

let allAnswerKeys = [];
let akExpanded = false;
const AK_COLLAPSED_COUNT = 4;

async function loadAnswerKeys() {
  const list = document.getElementById('akList');
  try {
    const res = await fetch('data/answerkeys.json');
    const data = await res.json();
    allAnswerKeys = data;
    renderAnswerKeys();
  } catch (e) {
    list.innerHTML = '<div class="ak-empty">Could not load answer keys.<br>Please try again later.</div>';
  }
}

function renderAnswerKeys() {
  const list = document.getElementById('akList');
  const viewMoreBtn = document.getElementById('akViewMore');

  if (!allAnswerKeys.length) {
    list.innerHTML = '<div class="ak-empty">No answer keys released yet.<br>Check back on exam day.</div>';
    viewMoreBtn.classList.add('hidden');
    return;
  }

  const visible = akExpanded ? allAnswerKeys : allAnswerKeys.slice(0, AK_COLLAPSED_COUNT);

  list.innerHTML = visible.map(ak => {
    const isActive = ak.active;
    const page = ak.type === 'rrb' ? 'rrb-calculator.html' : 'ssc-calculator.html';
    const badge = ak.badge ? `<span class="badge badge--new">${ak.badge}</span>` : '';
    return `
      <a href="${isActive ? page : '#'}" class="ak-row ${!isActive ? 'ak-row--inactive' : ''}">
        <span class="ak-row__link">${ak.exam}</span>
        <span class="ak-row__badges">
          <span class="badge badge--${ak.type}">${ak.type.toUpperCase()}</span>
          ${badge}
        </span>
      </a>`;
  }).join('');

  if (allAnswerKeys.length > AK_COLLAPSED_COUNT) {
    viewMoreBtn.classList.remove('hidden');
    viewMoreBtn.textContent = akExpanded ? 'Show less' : 'View more answer keys';
  } else {
    viewMoreBtn.classList.add('hidden');
  }
}

document.getElementById('akViewMore').addEventListener('click', () => {
  akExpanded = !akExpanded;
  renderAnswerKeys();
});

function formatDate(d) { try { return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); } catch { return d; } }
loadAnswerKeys();
</script>
</body>
</html>
