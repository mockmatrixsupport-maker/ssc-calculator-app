<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="SSC Score Calculator — Calculate your SSC exam score from the official answer key.">
<meta name="theme-color" content="#0f766e">
<title>SSC Score Calculator — Rank Score Master</title>
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="css/style.css">
<style>
.page-title-row { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-5); }
.page-title-row img { width: 44px; height: 44px; border-radius: var(--r-md); border: 1px solid var(--border-strong); object-fit: cover; }
.page-title-row h1 { font-size: 1.25rem; }
.page-title-row p { font-size: 0.76rem; color: var(--text-muted); margin-top: 2px; }

.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--sp-3); }
@media (max-width: 560px) { .form-grid-3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 360px) { .form-grid-3 { grid-template-columns: 1fr; } }

.results-placeholder { margin-top: var(--sp-6); }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header__inner">
    <a href="index.html" class="app-logo">
      <img src="logo.jpg" alt="Rank Score Master" class="app-logo__icon">
      <div class="app-logo__text">
        <span class="app-logo__name">Rank Score Master</span>
        <span class="app-logo__tagline">SSC · Railway · Analysis</span>
      </div>
    </a>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
        <svg id="iconDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="iconLight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="page-main">
  <div class="container">

    <a href="index.html" class="btn-back fade-up" style="margin-bottom: var(--sp-5);">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Home
    </a>

    <div class="page-title-row fade-up fade-up-1">
      <img src="ssc-logo.jpg" alt="SSC">
      <div>
        <h1>SSC Score Calculator</h1>
        <p>CGL · CHSL · GD Constable · CPO · MTS · Steno</p>
      </div>
    </div>

    <!-- Input Card -->
    <div class="card fade-up fade-up-2" id="inputCard">
      <div class="section-label">Answer Key Details</div>

      <div class="form-group">
        <label class="form-label">Answer Key URL <span class="required">*</span></label>
        <input type="text" class="form-input" id="sscUrl" placeholder="https://sscexams.cbexams.com/.../ViewCandResponse.aspx?EncKey=...">
        <div class="form-hint">Paste the link from your Rank Mitra / SSC response sheet page</div>
      </div>

      <div class="form-grid-3">
        <div class="form-group">
          <label class="form-label">Category <span class="required">*</span></label>
          <div class="form-select-wrap">
            <select class="form-select" id="category" required>
              <option value="" disabled selected>Select</option>
              <option value="general">General / UR</option>
              <option value="obc">OBC</option>
              <option value="sc">SC</option>
              <option value="st">ST</option>
              <option value="ews">EWS</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Horizontal Category</label>
          <div class="form-select-wrap">
            <select class="form-select" id="horizontalCategory">
              <option value="none" selected>None</option>
              <option value="esm">Ex-Servicemen (ESM)</option>
              <option value="pwbd-vi">PwBD — VI</option>
              <option value="pwbd-hi">PwBD — HI</option>
              <option value="pwbd-oh">PwBD — OH</option>
              <option value="pwbd-id">PwBD — ID</option>
              <option value="pwbd-other">PwBD — Other</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">State / UT <span class="required">*</span></label>
          <div class="form-select-wrap">
            <select class="form-select" id="state" required>
              <option value="" disabled selected>Select</option>
              <option>Andhra Pradesh</option><option>Arunachal Pradesh</option><option>Assam</option>
              <option>Bihar</option><option>Chhattisgarh</option><option>Delhi</option><option>Goa</option>
              <option>Gujarat</option><option>Haryana</option><option>Himachal Pradesh</option>
              <option>Jharkhand</option><option>Karnataka</option><option>Kerala</option>
              <option>Madhya Pradesh</option><option>Maharashtra</option><option>Manipur</option>
              <option>Meghalaya</option><option>Mizoram</option><option>Nagaland</option><option>Odisha</option>
              <option>Punjab</option><option>Rajasthan</option><option>Sikkim</option><option>Tamil Nadu</option>
              <option>Telangana</option><option>Tripura</option><option>Uttar Pradesh</option>
              <option>Uttarakhand</option><option>West Bengal</option><option>Jammu & Kashmir</option>
              <option>Ladakh</option><option>Chandigarh</option><option>Puducherry</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-grid-3 mt-4">
        <div class="form-group">
          <label class="form-label">Paper Language <span class="required">*</span></label>
          <div class="form-select-wrap">
            <select class="form-select" id="language" required>
              <option value="" disabled selected>Select</option>
              <option value="english">English</option>
              <option value="hindi">Hindi</option>
              <option value="bilingual">Bilingual</option>
              <option value="regional">Regional</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Correct Marks (+) <span class="required">*</span></label>
          <input type="number" class="form-input" id="correctMarks" value="2" step="0.25" min="0" required>
        </div>

        <div class="form-group">
          <label class="form-label">Wrong Marks (−) <span class="required">*</span></label>
          <input type="number" class="form-input" id="wrongMarks" value="0.5" step="0.25" min="0" required>
        </div>
      </div>

      <div class="divider"></div>

      <label class="checkbox-wrap">
        <input type="checkbox" id="termsCheck" checked>
        <span class="checkbox-text">
          <strong>I accept the terms & conditions.</strong>
          My answer key data may be used to generate score analysis, rank estimates and aggregate statistics. <a href="#">Read terms</a>
        </span>
      </label>

      <button class="btn btn--primary btn--full mt-5" id="fetchBtnSsc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
        Fetch & Calculate Score
      </button>
    </div>

    <!-- Log Card (hidden until fetch starts) -->
    <div class="card mt-5 hidden" id="logCard">
      <div class="section-label">Fetch Log</div>
      <div class="log-box" id="log"></div>
    </div>

    <!-- Results Placeholder (built later by score-engine.js) -->
    <div class="results-placeholder hidden" id="resultsSection">
      <!-- Tabs and result content injected by JS later -->
    </div>

  </div>
</main>

<footer class="app-footer">
  <p>Rank Score Master &copy; 2026 &nbsp;·&nbsp; For educational use only</p>
</footer>

<script>
const html = document.documentElement;
const toggleBtn = document.getElementById('themeToggle');
const iconDark = document.getElementById('iconDark');
const iconLight = document.getElementById('iconLight');
function applyTheme(t) {
  html.setAttribute('data-theme', t);
  localStorage.setItem('rsm-theme', t);
  iconDark.classList.toggle('hidden', t !== 'dark');
  iconLight.classList.toggle('hidden', t === 'dark');
}
applyTheme(localStorage.getItem('rsm-theme') || 'dark');
toggleBtn.addEventListener('click', () => applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

// NOTE: Fetch + parsing logic (fetcher-ssc.js, parser-ssc.js, calculator.js)
// will be wired up separately. This page is structure-only for now.
</script>

</body>
</html>
