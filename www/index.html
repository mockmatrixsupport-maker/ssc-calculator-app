<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSC Score Calculator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; padding: 20px 16px; }

h1 { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
.sub { font-size: 0.78rem; color: #64748b; margin-bottom: 20px; }

.card { background: #1e2330; border: 1px solid #2d3348; border-radius: 10px; padding: 18px; margin-bottom: 14px; }
label { display: block; font-size: 0.72rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
input, select { width: 100%; background: #0f1117; border: 1px solid #2d3348; border-radius: 7px; color: #e2e8f0; font-size: 0.85rem; padding: 9px 12px; outline: none; font-family: inherit; margin-bottom: 12px; }
input:focus, select:focus { border-color: #4f6ef7; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

button { width: 100%; background: #4f6ef7; color: #fff; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; padding: 12px; cursor: pointer; font-family: inherit; transition: background 0.15s; }
button:hover:not(:disabled) { background: #3b56d9; }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.tab-row { display: flex; gap: 1px; margin-bottom: 0; }
.tab { flex: 1; background: #2d3348; color: #94a3b8; border: none; border-radius: 0; font-size: 0.78rem; font-weight: 600; padding: 9px 4px; cursor: pointer; font-family: inherit; }
.tab.active { background: #4f6ef7; color: #fff; }
.tab:first-child { border-radius: 8px 0 0 8px; }
.tab:last-child { border-radius: 0 8px 8px 0; }

.panel { display: none; }
.panel.active { display: block; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.info-item { background: #0f1117; border: 1px solid #2d3348; border-radius: 7px; padding: 10px 12px; }
.info-key { font-size: 0.68rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 3px; }
.info-val { font-size: 0.85rem; font-weight: 600; color: #f8fafc; }

.score-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
.score-box { background: #0f1117; border: 1px solid #2d3348; border-radius: 8px; padding: 14px 12px; text-align: center; }
.score-box .num { font-size: 1.6rem; font-weight: 800; margin-bottom: 3px; }
.score-box .lbl { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.4px; }
.score-box.total { grid-column: 1 / -1; background: #1a2a4a; border-color: #4f6ef7; }
.score-box.total .num { font-size: 2rem; color: #60a5fa; }

.green { color: #22c55e; }
.red { color: #ef4444; }
.yellow { color: #f59e0b; }
.blue { color: #60a5fa; }
.gray { color: #94a3b8; }

.parts-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-bottom: 14px; }
.parts-table th { background: #2d3348; color: #94a3b8; font-size: 0.7rem; text-transform: uppercase; padding: 8px 10px; text-align: left; }
.parts-table td { padding: 9px 10px; border-bottom: 1px solid #2d3348; }
.parts-table tr:hover td { background: #1a1f2e; }

.log { background: #0f1117; border: 1px solid #2d3348; border-radius: 8px; padding: 12px; font-size: 0.75rem; font-family: monospace; max-height: 200px; overflow-y: auto; line-height: 1.8; }
.log-ok { color: #22c55e; }
.log-err { color: #ef4444; }
.log-info { color: #94a3b8; }
.log-warn { color: #f59e0b; }

.badge { font-size: 0.65rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
.badge-g { background: #14532d; color: #4ade80; }
.badge-r { background: #450a0a; color: #f87171; }
.badge-y { background: #713f12; color: #fbbf24; }
.badge-b { background: #1e3a5f; color: #60a5fa; }

.mode-row { display: flex; gap: 8px; margin-bottom: 12px; }
.mode-btn { flex: 1; background: #2d3348; color: #94a3b8; border: 1px solid #3d4562; border-radius: 7px; font-size: 0.78rem; font-weight: 600; padding: 8px; cursor: pointer; font-family: inherit; }
.mode-btn.active { background: #1a3a5c; border-color: #4f6ef7; color: #60a5fa; }

.hidden { display: none !important; }
</style>
</head>
<body>

<h1>SSC Score Calculator</h1>
<p class="sub">SSC answer key se score calculate karo — no bridge needed!</p>

<!-- Mode -->
<div class="mode-row">
  <button class="mode-btn active" id="mDirect" onclick="setMode('direct')">⚡ Direct Fetch</button>
  <button class="mode-btn" id="mFile" onclick="setMode('file')">📁 HTML File Upload</button>
</div>

<!-- Direct Fetch Mode -->
<div id="directMode" class="card">
  <label>SSC Answer Key URL</label>
  <input type="text" id="sscUrl" placeholder="https://sscexams.cbexams.com/.../ViewCandResponse.aspx?EncKey=...">
  <button onclick="fetchDirect()" id="fetchBtn">⚡ Fetch & Calculate Score</button>
</div>

<!-- File Mode -->
<div id="fileMode" class="card hidden">
  <label>Upload Part HTML Files (1 ya zyada)</label>
  <input type="file" id="fileInput" accept=".html" multiple onchange="handleFiles()">
  <div id="fileStatus" style="font-size:0.78rem; color:#64748b; margin-top:-8px; margin-bottom:8px;"></div>
  <button onclick="calculateFromFiles()" id="calcBtn" disabled>📊 Calculate Score</button>
</div>

<!-- Marking Scheme -->
<div class="card">
  <div class="row2">
    <div>
      <label>✓ Correct Marks</label>
      <input type="number" id="correctMarks" value="2" step="0.25" min="0">
    </div>
    <div>
      <label>✗ Wrong Marks (deduction)</label>
      <input type="number" id="wrongMarks" value="0.5" step="0.25" min="0">
    </div>
  </div>
  <div style="font-size:0.72rem; color:#64748b; margin-top:-8px;">SSC GD: +2/-0.5 | SSC CGL: +2/-0.5 | Change as needed</div>
</div>

<!-- Log -->
<div class="card" id="logCard" style="display:none">
  <div class="log" id="log"></div>
</div>

<!-- Results -->
<div id="results" style="display:none">

  <div class="tab-row">
    <button class="tab active" onclick="showTab('summary')">Summary</button>
    <button class="tab" onclick="showTab('parts')">Parts</button>
    <button class="tab" onclick="showTab('candidate')">Candidate</button>
  </div>

  <div id="tab-summary" class="panel active card" style="border-radius:0 0 10px 10px; border-top:none;">
    <div class="score-grid" id="scoreGrid"></div>
  </div>

  <div id="tab-parts" class="panel card" style="border-radius:0 0 10px 10px; border-top:none;">
    <table class="parts-table" id="partsTable">
      <thead>
        <tr>
          <th>Part</th>
          <th>Qs</th>
          <th class="green">✓</th>
          <th class="red">✗</th>
          <th class="yellow">–</th>
          <th class="blue">★</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="partsBody"></tbody>
    </table>
  </div>

  <div id="tab-candidate" class="panel card" style="border-radius:0 0 10px 10px; border-top:none;">
    <div class="info-grid" id="candidateInfo"></div>
  </div>

</div>

<script>
// ─── STATE ───
let mode = 'direct';
let uploadedFiles = {};
let parsedResult = null;

// ─── MODE ───
function setMode(m) {
  mode = m;
  document.getElementById('mDirect').classList.toggle('active', m === 'direct');
  document.getElementById('mFile').classList.toggle('active', m === 'file');
  document.getElementById('directMode').classList.toggle('hidden', m !== 'direct');
  document.getElementById('fileMode').classList.toggle('hidden', m !== 'file');
}

// ─── LOG ───
function clearLog() {
  document.getElementById('log').innerHTML = '';
  document.getElementById('logCard').style.display = 'none';
}
function log(msg, cls = 'log-info') {
  const el = document.getElementById('log');
  document.getElementById('logCard').style.display = 'block';
  el.innerHTML += `<div class="${cls}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

// ─── FILE UPLOAD ───
function handleFiles() {
  const files = document.getElementById('fileInput').files;
  uploadedFiles = {};
  let names = [];
  Array.from(files).forEach(f => {
    const m = f.name.match(/p(\d+)/i);
    const key = m ? `p${m[1]}` : `p${Object.keys(uploadedFiles).length + 1}`;
    names.push(f.name);
    const reader = new FileReader();
    reader.onload = e => { uploadedFiles[key] = e.target.result; };
    reader.readAsText(f);
  });
  document.getElementById('fileStatus').textContent = `${files.length} file(s): ${names.join(', ')}`;
  document.getElementById('calcBtn').disabled = files.length === 0;
}

async function calculateFromFiles() {
  if (Object.keys(uploadedFiles).length === 0) { alert('Files select karo!'); return; }
  clearLog();
  log('Files parse kar raha hai...');
  processData({ parts: uploadedFiles, count: Object.keys(uploadedFiles).length });
}

// ─── DIRECT FETCH (no bridge, user's own IP) ───
async function fetchDirect() {
  const sscUrl = document.getElementById('sscUrl').value.trim();
  if (!sscUrl) { alert('SSC URL daalo!'); return; }

  clearLog();
  document.getElementById('results').style.display = 'none';
  document.getElementById('fetchBtn').disabled = true;

  log('Direct fetch ho raha hai (aapke phone ke IP se)...');
  log(`URL: ${sscUrl.substring(0, 70)}...`);

  try {
    const urlMatch = sscUrl.match(/(https?:\/\/.+\/)ViewCandResponse\d*\.aspx/i);
    const keyMatch = sscUrl.match(/(?:enckey|EncKey)=([^&]+)/i);

    if (!urlMatch || !keyMatch) {
      log('Invalid SSC URL format!', 'log-err');
      document.getElementById('fetchBtn').disabled = false;
      return;
    }

    const base = urlMatch[1];
    const enckey = keyMatch[1];
    const parts = {};

    for (let i = 1; i <= 10; i++) {
      const url = i === 1
        ? `${base}ViewCandResponse.aspx?enckey=${enckey}`
        : `${base}ViewCandResponse${i}.aspx?EncKey=${enckey}`;

      log(`Part ${i} fetch ho raha hai...`);

      try {
        const resp = await fetch(url, {
          method: 'GET',
          headers: {
            'Accept': 'text/html,application/xhtml+xml,*/*;q=0.8',
            'Accept-Language': 'en-IN,en;q=0.9'
          },
          credentials: 'include'
        });

        if (!resp.ok) {
          log(`Part ${i}: HTTP ${resp.status} — ruk gaye`, 'log-warn');
          break;
        }

        const html = await resp.text();

        if (!html.includes('Q.No') && !html.includes('ViewCandResponse')) {
          log(`Part ${i}: Data nahi mila — complete`, 'log-info');
          break;
        }

        parts[`p${i}`] = html;
        log(`Part ${i}: OK (${html.length} chars)`, 'log-ok');

      } catch (e) {
        log(`Part ${i}: Error — ${e.message}`, 'log-err');
        break;
      }
    }

    if (Object.keys(parts).length === 0) {
      log('Koi part nahi mila! URL check karo.', 'log-err');
      document.getElementById('fetchBtn').disabled = false;
      return;
    }

    log(`✓ ${Object.keys(parts).length} part(s) mila — calculate ho raha hai...`, 'log-ok');
    processData({ parts, count: Object.keys(parts).length });

  } catch (e) {
    log(`Error: ${e.message}`, 'log-err');
  }

  document.getElementById('fetchBtn').disabled = false;
}

// ─── MAIN PARSER ───
function processData(data) {
  const correctMark = parseFloat(document.getElementById('correctMarks').value) || 2;
  const wrongMark = parseFloat(document.getElementById('wrongMarks').value) || 0.5;

  let candidateInfo = null;
  let allParts = [];
  let totalCorrect = 0, totalWrong = 0, totalSkipped = 0, totalBonus = 0, totalQ = 0;

  const sortedKeys = Object.keys(data.parts).sort((a,b) => {
    const na = parseInt(a.replace(/\D/g,'')) || 0;
    const nb = parseInt(b.replace(/\D/g,'')) || 0;
    return na - nb;
  });

  sortedKeys.forEach((key, idx) => {
    const html = data.parts[key];
    log(`Part ${idx+1} parse kar raha hai...`);

    if (idx === 0 || !candidateInfo) {
      candidateInfo = parseCandidateInfo(html);
    }

    const part = parsePart(html, key, idx + 1);
    allParts.push(part);

    totalCorrect += part.correct;
    totalWrong += part.wrong;
    totalSkipped += part.skipped;
    totalBonus += part.bonus;
    totalQ += part.total;

    log(`  ${part.name}: ${part.total}Q | ✓${part.correct} ✗${part.wrong} –${part.skipped} ★${part.bonus}`, 'log-ok');
  });

  const totalScore = (totalCorrect * correctMark) - (totalWrong * wrongMark) + (totalBonus * correctMark);
  const maxScore = totalQ * correctMark;
  const pct = maxScore > 0 ? ((totalScore / maxScore) * 100).toFixed(2) : 0;

  log(`✓ Parse complete — Score: ${totalScore.toFixed(2)}/${maxScore}`, 'log-ok');

  parsedResult = { candidateInfo, allParts, totalCorrect, totalWrong, totalSkipped, totalBonus, totalQ, totalScore, maxScore, pct, correctMark, wrongMark };
  renderResults();
}

// ─── CANDIDATE INFO PARSER ───
function parseCandidateInfo(html) {
  const info = {};
  const rollM = html.match(/Roll\s*No[^<]*<\/td>\s*<td[^>]*>:?&nbsp;&nbsp;&nbsp;([^<\s]+)/i);
  if (rollM) info['Roll No'] = rollM[1].trim();
  const nameM = html.match(/Candidate\s*Name[^<]*<\/td>\s*<td[^>]*>:?&nbsp;&nbsp;&nbsp;([^<]+)/i);
  if (nameM) info['Name'] = nameM[1].trim();
  const examM = html.match(/<option[^>]*selected[^>]*>([^<]+)<\/option>/i);
  if (examM) info['Exam'] = examM[1].trim();
  const dateM = html.match(/Test\s*Date[^<]*<\/td>\s*<td[^>]*>:?&nbsp;&nbsp;&nbsp;([^<]+)/i);
  if (dateM) info['Date'] = dateM[1].trim();
  const shiftM = html.match(/Test\s*Time[^<]*<\/td>\s*<td[^>]*>:?&nbsp;&nbsp;&nbsp;([^<]+)/i);
  if (shiftM) info['Shift'] = shiftM[1].trim();
  const centreM = html.match(/Centre\s*Name[^<]*<\/td>\s*<td[^>]*>:?&nbsp;&nbsp;&nbsp;([^<]+)/i);
  if (centreM) info['Centre'] = centreM[1].trim();
  return info;
}

// ─── PART PARSER ───
function parsePart(html, key, partNum) {
  let partName = `Part ${partNum}`;
  const spanM = html.match(/<span[^>]*id=['"]lblsubject['"][^>]*>([^<]+)<\/span>/i);
  if (spanM) partName = spanM[1].trim();

  const questions = [];
  const qnoRegex = /Q\.No:&nbsp;(\d+)/gi;
  const qPositions = [];
  let qMatch;

  while ((qMatch = qnoRegex.exec(html)) !== null) {
    qPositions.push({ qno: parseInt(qMatch[1]), pos: qMatch.index });
  }

  qPositions.forEach((qInfo, idx) => {
    const start = qInfo.pos;
    const end = idx + 1 < qPositions.length ? qPositions[idx + 1].pos : html.length;
    const block = html.substring(start, end);
    const options = parseOptions(block);
    if (options.length >= 4) {
      questions.push({ qno: qInfo.qno, options });
    }
  });

  let correct = 0, wrong = 0, skipped = 0, bonus = 0;
  questions.forEach(q => {
    const status = getQuestionStatus(q.options);
    if (status === 'correct') correct++;
    else if (status === 'wrong') wrong++;
    else if (status === 'skipped') skipped++;
    else if (status === 'bonus') bonus++;
  });

  return { key, name: partName, total: questions.length, correct, wrong, skipped, bonus, questions };
}

// ─── OPTION PARSER ───
function parseOptions(block) {
  const options = [];
  const optCommentRegex = /<!--\s*Option\s+(\d+)\s*-->([\s\S]*?)(?=<!--\s*Option\s+\d+\s*-->|<!--\s*Candidate\s*Response|$)/gi;
  let optMatch;

  while ((optMatch = optCommentRegex.exec(block)) !== null) {
    const optNum = parseInt(optMatch[1]);
    const optBlock = optMatch[2];
    const bgcolorM = optBlock.match(/<td[^>]*width=['"]2%['"][^>]*bgcolor=['"](\w+)['"][^>]*>/i);
    const color = bgcolorM ? bgcolorM[1].toLowerCase() : null;
    options.push({ num: optNum, color });
  }

  if (options.length < 4) {
    return parseOptionsFallback(block);
  }
  return options;
}

function parseOptionsFallback(block) {
  const options = [];
  const tdRegex = /<tr[^>]*>[\s\S]*?<td[^>]*width=['"]2%['"][^>]*(?:bgcolor=['"](\w+)['"])?[^>]*>/gi;
  let tdMatch;
  let count = 0;

  while ((tdMatch = tdRegex.exec(block)) !== null && count < 8) {
    const fullTd = tdMatch[0];
    if (fullTd.toLowerCase().includes("valign='top'") || fullTd.toLowerCase().includes('valign="top"')) continue;
    const color = tdMatch[1] ? tdMatch[1].toLowerCase() : null;
    options.push({ num: count + 1, color });
    count++;
  }
  return options.slice(0, 8);
}

// ─── STATUS FROM OPTIONS ───
function getQuestionStatus(options) {
  const colors = options.map(o => o.color);
  const nonNullColors = colors.filter(c => c !== null);
  if (nonNullColors.length === 0) return 'skipped';
  if (colors.includes('green') && !colors.includes('red')) return 'correct';
  if (colors.includes('red')) return 'wrong';
  if (colors.includes('yellow') && !colors.includes('green') && !colors.includes('red')) return 'skipped';
  if (colors.every(c => c === 'gray' || c === null)) return 'skipped';
  if (colors.filter(c => c === 'green').length > 1) return 'bonus';
  return 'skipped';
}

// ─── RENDER RESULTS ───
function renderResults() {
  if (!parsedResult) return;
  const r = parsedResult;

  document.getElementById('results').style.display = 'block';

  const scoreGrid = document.getElementById('scoreGrid');
  scoreGrid.innerHTML = `
    <div class="score-box total">
      <div class="num blue">${r.totalScore.toFixed(2)}</div>
      <div class="lbl">Score / ${r.maxScore}</div>
    </div>
    <div class="score-box">
      <div class="num" style="font-size:1.3rem">${r.pct}%</div>
      <div class="lbl">Percentage</div>
    </div>
    <div class="score-box">
      <div class="num green">${r.totalCorrect}</div>
      <div class="lbl">Correct</div>
    </div>
    <div class="score-box">
      <div class="num red">${r.totalWrong}</div>
      <div class="lbl">Wrong</div>
    </div>
    <div class="score-box">
      <div class="num gray">${r.totalSkipped}</div>
      <div class="lbl">Skipped</div>
    </div>
    <div class="score-box">
      <div class="num yellow">${r.totalBonus}</div>
      <div class="lbl">Bonus</div>
    </div>
    <div class="score-box">
      <div class="num">${r.totalQ}</div>
      <div class="lbl">Total Questions</div>
    </div>
    <div class="score-box">
      <div class="num" style="font-size:1rem">+${r.correctMark}/-${r.wrongMark}</div>
      <div class="lbl">Marking Scheme</div>
    </div>
  `;

  const tbody = document.getElementById('partsBody');
  tbody.innerHTML = '';
  r.allParts.forEach(p => {
    const score = (p.correct * r.correctMark) - (p.wrong * r.wrongMark) + (p.bonus * r.correctMark);
    const max = p.total * r.correctMark;
    tbody.innerHTML += `
      <tr>
        <td style="font-size:0.75rem">${p.name}</td>
        <td>${p.total}</td>
        <td class="green">${p.correct}</td>
        <td class="red">${p.wrong}</td>
        <td class="gray">${p.skipped}</td>
        <td class="yellow">${p.bonus}</td>
        <td><b>${score.toFixed(2)}</b><span style="color:#64748b;font-size:0.7rem">/${max}</span></td>
      </tr>
    `;
  });

  const infoGrid = document.getElementById('candidateInfo');
  infoGrid.innerHTML = '';
  if (r.candidateInfo) {
    Object.entries(r.candidateInfo).forEach(([k, v]) => {
      infoGrid.innerHTML += `
        <div class="info-item">
          <div class="info-key">${k}</div>
          <div class="info-val">${v}</div>
        </div>
      `;
    });
  }
}

// ─── TABS ───
function showTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const tabs = ['summary', 'parts', 'candidate'];
    t.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
}
</script>
</body>
</html>
