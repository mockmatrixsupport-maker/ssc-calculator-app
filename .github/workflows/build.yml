name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      # ── Read version from package.json (used for versionName below) ──
      - name: Read version from package.json
        id: pkgversion
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # ── Stage the web app into www/ ──────────────────────────────
      - name: Stage web assets into www/
        run: |
          mkdir -p www
          cp index.html calculator.html notifications.html review.html official-print.html www/
          cp calculators.json www/
          cp logo.jpg ssc-logo.jpg railway-logo.jpg www/
          cp -r css www/
          cp -r js www/
          cp -r data www/

      - name: Add Android platform
        run: npx cap add android

      # ── NEW STEP: Custom MainActivity.java ─────────────────────────
      # Stock Capacitor generates an EMPTY MainActivity (just extends
      # BridgeActivity, no overrides at all). That's why:
      #   1. Back button doesn't reliably exit on Android 13-15 — no
      #      OnBackPressedCallback is registered, so predictive-back
      #      dispatch has nothing to fall through to.
      #   2. Reopening the app never resumes the last page — nothing
      #      calls webView.saveState()/restoreState() on its own.
      # This overwrites that generated file with one that fixes both.
      # onSaveInstanceState/onRestoreInstanceState MUST be public here —
      # BridgeActivity declares them public, and Java forbids an override
      # from weakening access to protected (this caused the build failure).
      - name: Write custom MainActivity.java (back button + resume-last-page fix)
        run: |
          PKG_PATH=$(echo "com.rankscoremaster.app" | tr '.' '/')
          MAIN_ACTIVITY_DIR="android/app/src/main/java/$PKG_PATH"
          mkdir -p "$MAIN_ACTIVITY_DIR"
          cat > "$MAIN_ACTIVITY_DIR/MainActivity.java" << 'EOF'
          package com.rankscoremaster.app;

          import android.os.Bundle;
          import android.webkit.WebView;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Modern back-gesture API — required for correct behavior
                  // on Android 13-15 with predictive back enabled. Falls
                  // through to app exit only when the WebView has nowhere
                  // left to go back to.
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          WebView webView = getBridge().getWebView();
                          if (webView != null && webView.canGoBack()) {
                              webView.goBack();
                          } else {
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                          }
                      }
                  });
              }

              @Override
              public void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  WebView webView = getBridge().getWebView();
                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              @Override
              public void onRestoreInstanceState(Bundle savedInstanceState) {
                  super.onRestoreInstanceState(savedInstanceState);
                  WebView webView = getBridge().getWebView();
                  if (webView != null) {
                      webView.restoreState(savedInstanceState);
                  }
              }
          }
          EOF
          echo "Wrote custom MainActivity.java to $MAIN_ACTIVITY_DIR"

      # ── Firebase Cloud Messaging config ──────────────────────────
      - name: Decode google-services.json into android/app/
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Add Google Services Gradle plugin
        run: |
          # Project-level build.gradle: add the classpath dependency
          sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          # App-level build.gradle: apply the plugin (must come after the android {} block)
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

      - name: Copy web assets
        run: npx cap copy android
        
      - name: Sync
        run: npx cap sync android

      - name: Update Target SDK and Version
        run: |
          # Force Android 14 (API 34) compliance for Play Protect
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/g' android/variables.gradle
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 34/g' android/variables.gradle
          # Dynamically bump version code based on GitHub Actions run number so it installs over the old APK
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          # versionName now sourced from package.json, not the run number — this is what
          # @capacitor/app's App.getInfo().version reads at runtime, compared against
          # version.json's "latestVersion" by update-check.js
          sed -i "s/versionName \".*\"/versionName \"${{ steps.pkgversion.outputs.version }}\"/" android/app/build.gradle

      - name: Allow mixed content in WebView
        run: |
          sed -i 's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml || true
          grep -q 'usesCleartextTraffic' android/app/src/main/AndroidManifest.xml || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      # ── NEW STEP: Enable predictive-back callback support ──────────
      # Required on Android 13+, and specifically what your Android 15
      # phone needs to receive back-press events reliably through the
      # OnBackPressedDispatcher registered in MainActivity.java above.
      # Without this, the system can silently swallow back-press events
      # instead of routing them to the app at all.
      - name: Enable OnBackInvokedCallback in manifest
        run: |
          grep -q 'android:enableOnBackInvokedCallback' android/app/src/main/AndroidManifest.xml || \
          sed -i 's/<application/<application android:enableOnBackInvokedCallback="true"/' android/app/src/main/AndroidManifest.xml

      # ── NEW STEP: INJECTS PERMISSIONS DYNAMICALLY ─────────────────
      - name: Add Storage, Media, and Notification Permissions
        run: |
          PERMISSIONS="<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"\/>\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"\/>\n    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\"\/>\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"\/>\n\n    <application"
          sed -i "s/<application/$PERMISSIONS/" android/app/src/main/AndroidManifest.xml
      # ──────────────────────────────────────────────────────────────

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Patch release signing config into build.gradle
        run: python3 patch_gradle_signing.py

      # ── Decode keystore from secret ──────────────────────────────
      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      # ── Build signed RELEASE APK ─────────────────────────────────
      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RankScoreMaster-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      # ── Also build AAB (needed for Play Store) ───────────────────
      - name: Build Signed AAB (Play Store bundle)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: RankScoreMaster-Signed-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
