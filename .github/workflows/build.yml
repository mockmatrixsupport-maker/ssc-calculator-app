name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      # ── Read version from package.json (used for versionName below) ──
      - name: Read version from package.json
        id: pkgversion
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # ── Stage the web app into www/ ──────────────────────────────
      - name: Stage web assets into www/
        run: |
          mkdir -p www
          cp index.html calculator.html notifications.html review.html test.html official-print.html www/
          cp calculators.json www/
          cp logo.jpg ssc-logo.jpg railway-logo.jpg www/
          cp -r css www/
          cp -r js www/
          cp -r data www/

      - name: Add Android platform
        run: npx cap add android

      # ── Custom MainActivity.java: back button + resume-last-page fix ──
      # onSaveInstanceState/onRestoreInstanceState MUST be public — BridgeActivity
      # declares them public, and Java forbids weakening access on override.
      #
      # Back-press else branch calls finish() directly instead of
      # re-invoking getOnBackPressedDispatcher().onBackPressed() — that
      # re-invocation approach is fragile and can fall through to
      # Capacitor's own default back handling, which minimizes the app
      # instead of closing it. finish() is unambiguous and always exits.
      - name: Write custom MainActivity.java (back button + resume-last-page fix)
        run: |
          PKG_PATH=$(echo "com.rankscoremaster.app" | tr '.' '/')
          MAIN_ACTIVITY_DIR="android/app/src/main/java/$PKG_PATH"
          mkdir -p "$MAIN_ACTIVITY_DIR"
          cat > "$MAIN_ACTIVITY_DIR/MainActivity.java" << 'EOF'
          package com.rankscoremaster.app;

          import android.os.Bundle;
          import android.webkit.WebView;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          WebView webView = getBridge().getWebView();
                          if (webView != null && webView.canGoBack()) {
                              webView.goBack();
                          } else {
                              finish();
                          }
                      }
                  });
              }

              @Override
              public void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  WebView webView = getBridge().getWebView();
                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              @Override
              public void onRestoreInstanceState(Bundle savedInstanceState) {
                  super.onRestoreInstanceState(savedInstanceState);
                  WebView webView = getBridge().getWebView();
                  if (webView != null) {
                      webView.restoreState(savedInstanceState);
                  }
              }
          }
          EOF
          echo "Wrote custom MainActivity.java to $MAIN_ACTIVITY_DIR"

      # ── Firebase Cloud Messaging config ──────────────────────────
      - name: Decode google-services.json into android/app/
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Add Google Services Gradle plugin
        run: |
          sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

      - name: Copy web assets
        run: npx cap copy android

      - name: Sync
        run: npx cap sync android

      - name: Update Target SDK and Version
        run: |
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/g' android/variables.gradle
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 34/g' android/variables.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ steps.pkgversion.outputs.version }}\"/" android/app/build.gradle

      - name: Allow mixed content in WebView
        run: |
          sed -i 's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml || true
          grep -q 'usesCleartextTraffic' android/app/src/main/AndroidManifest.xml || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      # ── Enable predictive-back callback support (Android 13+/15) ──
      - name: Enable OnBackInvokedCallback in manifest
        run: |
          grep -q 'android:enableOnBackInvokedCallback' android/app/src/main/AndroidManifest.xml || \
          sed -i 's/<application/<application android:enableOnBackInvokedCallback="true"/' android/app/src/main/AndroidManifest.xml

      # ── Permissions ─────────────────────────────────────────────
      - name: Add Storage, Media, and Notification Permissions
        run: |
          PERMISSIONS="<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"\/>\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"\/>\n    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\"\/>\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"\/>\n\n    <application"
          sed -i "s/<application/$PERMISSIONS/" android/app/src/main/AndroidManifest.xml

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Patch release signing config into build.gradle
        run: python3 patch_gradle_signing.py

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RankScoreMaster-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Build Signed AAB (Play Store bundle)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: RankScoreMaster-Signed-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
