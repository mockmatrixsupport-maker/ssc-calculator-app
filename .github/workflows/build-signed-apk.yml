name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      # ── Read version from package.json (used for versionName below) ──
      - name: Read version from package.json
        id: pkgversion
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # ── Stage the web app into www/ ──────────────────────────────
      - name: Stage web assets into www/
        run: |
          mkdir -p www
          cp index.html calculator.html notifications.html review.html test.html official-print.html www/
          cp calculators.json www/
          cp logo.jpg mockmatrix-logo.png ssc-logo.jpg railway-logo.jpg www/
          cp -r css www/
          cp -r js www/
          cp -r data www/

      - name: Add Android platform
        run: npx cap add android

      # ── Custom MainActivity.java: back button + resume-last-page fix
      # + two-tab structure (Rank Master / Mock Matrix Hub) ──────────
      # Rank Master keeps using Capacitor's OWN bridge WebView, completely
      # untouched — it never navigates away from its local origin, so it
      # can never hit the documented Capacitor Android bug where
      # Capacitor.getPlatform() starts reporting "web" after navigating
      # to an external allowNavigation URL (ionic-team/capacitor#7454),
      # which would silently break push notifications / printing.
      #
      # Mock Matrix Hub instead gets its own SEPARATE plain WebView (no
      # Capacitor bridge at all) that just loads the live URL directly —
      # not subject to allowNavigation restrictions since it isn't
      # Capacitor's bridge WebView in the first place.
      #
      # EDIT THE MOCK_MATRIX_URL CONSTANT BELOW to your real live URL
      # before this will work.
      - name: Write custom MainActivity.java (back button + resume-last-page fix + dual tabs)
        run: |
          PKG_PATH=$(echo "com.rankscoremaster.app" | tr '.' '/')
          MAIN_ACTIVITY_DIR="android/app/src/main/java/$PKG_PATH"
          mkdir -p "$MAIN_ACTIVITY_DIR"
          cat > "$MAIN_ACTIVITY_DIR/MainActivity.java" << 'EOF'
          package com.rankscoremaster.app;

          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              // ── EDIT THIS to your live Mock Matrix Hub URL ──────
              private static final String MOCK_MATRIX_URL = "https://mockmatrixhub.pages.dev/";
              // ──────────────────────────────────────────────────

              private WebView mockMatrixWebView;
              private View capacitorRootView;
              private boolean showingMockMatrix = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  registerPlugin(TabSwitcherPlugin.class);
                  super.onCreate(savedInstanceState);

                  // Grab whatever Capacitor just set as the content view
                  // (its own root, containing the bridge WebView) so it
                  // can be re-parented into our own container below —
                  // NOT rebuilt, NOT reconfigured, just moved.
                  ViewGroup androidContent = findViewById(android.R.id.content);
                  capacitorRootView = androidContent.getChildAt(0);
                  androidContent.removeView(capacitorRootView);

                  FrameLayout tabContainer = new FrameLayout(this);
                  tabContainer.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  tabContainer.addView(capacitorRootView);

                  mockMatrixWebView = new WebView(this);
                  mockMatrixWebView.setLayoutParams(new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  WebSettings settings = mockMatrixWebView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  mockMatrixWebView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          // Stay inside the app for Mock Matrix Hub's own pages.
                          if (url.startsWith(MOCK_MATRIX_URL) || url.contains("mockmatrixhub.pages.dev")) {
                              return false;
                          }
                          // Everything else — WhatsApp, Telegram, YouTube, Instagram,
                          // Play Store, or any other website link — gets handed to
                          // Android itself. The system picks the installed app for
                          // that link (WhatsApp app, Telegram app, YouTube app,
                          // Instagram app, Play Store app) or falls back to the
                          // phone's default browser for a plain website URL.
                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              intent.addCategory(Intent.CATEGORY_BROWSABLE);
                              view.getContext().startActivity(intent);
                          } catch (ActivityNotFoundException e) {
                              // No app can handle it (rare) — last resort, try a browser Intent.
                              try {
                                  Intent fallback = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  fallback.setPackage("com.android.chrome");
                                  view.getContext().startActivity(fallback);
                              } catch (ActivityNotFoundException e2) {
                                  // Truly nothing can open it — ignore rather than crash.
                              }
                          }
                          return true;
                      }
                  });
                  // JS bridge for Mock Matrix Hub's OWN page to call back
                  // into native to switch tabs — used like:
                  //   window.AndroidBridge && AndroidBridge.switchToRankMaster();
                  mockMatrixWebView.addJavascriptInterface(new Object() {
                      @android.webkit.JavascriptInterface
                      public void switchToRankMaster() {
                          runOnUiThread(MainActivity.this::showRankMasterTab);
                      }
                  }, "AndroidBridge");
                  mockMatrixWebView.setVisibility(View.GONE);
                  tabContainer.addView(mockMatrixWebView);

                  setContentView(tabContainer);

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (showingMockMatrix) {
                              if (mockMatrixWebView.canGoBack()) {
                                  mockMatrixWebView.goBack();
                              } else {
                                  showRankMasterTab();
                              }
                              return;
                          }
                          WebView webView = getBridge().getWebView();
                          // On the home page specifically, back always exits the
                          // app — regardless of whether canGoBack() is technically
                          // true. canGoBack() reflects the WHOLE navigation stack,
                          // so without this check, if other pages were visited
                          // earlier in the session, pressing back while sitting on
                          // the home page could hop to one of those old pages
                          // instead of exiting, which isn't the expected "home = exit" behavior.
                          String currentUrl = webView != null ? webView.getUrl() : null;
                          boolean onHomePage = currentUrl != null && currentUrl.endsWith("/index.html");
                          if (onHomePage) {
                              finish();
                              return;
                          }
                          if (webView != null && webView.canGoBack()) {
                              webView.goBack();
                          } else {
                              finish();
                          }
                      }
                  });
              }

              // Called by TabSwitcherPlugin (from Rank Master's own JS via
              // Capacitor.Plugins.TabSwitcher.switchTo({ tab: 'mockmatrix' }))
              public void showMockMatrixTab() {
                  mockMatrixWebView.loadUrl(MOCK_MATRIX_URL);
                  capacitorRootView.setVisibility(View.GONE);
                  mockMatrixWebView.setVisibility(View.VISIBLE);
                  showingMockMatrix = true;
              }

              public void showRankMasterTab() {
                  capacitorRootView.setVisibility(View.VISIBLE);
                  mockMatrixWebView.setVisibility(View.GONE);
                  showingMockMatrix = false;
              }

              @Override
              public void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  WebView webView = getBridge().getWebView();
                  if (webView != null) {
                      webView.saveState(outState);
                  }
              }

              @Override
              public void onRestoreInstanceState(Bundle savedInstanceState) {
                  super.onRestoreInstanceState(savedInstanceState);
                  WebView webView = getBridge().getWebView();
                  if (webView != null) {
                      webView.restoreState(savedInstanceState);
                  }
              }
          }
          EOF
          echo "Wrote custom MainActivity.java to $MAIN_ACTIVITY_DIR"

      # ── Custom TabSwitcherPlugin.java: lets Rank Master's own JS
      # (running inside Capacitor's bridge) tell native to show the
      # Mock Matrix tab, via Capacitor.Plugins.TabSwitcher.switchTo(...) ──
      - name: Write custom TabSwitcherPlugin.java
        run: |
          PKG_PATH=$(echo "com.rankscoremaster.app" | tr '.' '/')
          MAIN_ACTIVITY_DIR="android/app/src/main/java/$PKG_PATH"
          mkdir -p "$MAIN_ACTIVITY_DIR"
          cat > "$MAIN_ACTIVITY_DIR/TabSwitcherPlugin.java" << 'EOF'
          package com.rankscoremaster.app;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "TabSwitcher")
          public class TabSwitcherPlugin extends Plugin {
              @PluginMethod
              public void switchTo(PluginCall call) {
                  String tab = call.getString("tab", "rankmaster");
                  MainActivity activity = (MainActivity) getActivity();
                  if (activity != null) {
                      activity.runOnUiThread(() -> {
                          if ("mockmatrix".equals(tab)) {
                              activity.showMockMatrixTab();
                          } else {
                              activity.showRankMasterTab();
                          }
                      });
                  }
                  call.resolve();
              }
          }
          EOF
          echo "Wrote custom TabSwitcherPlugin.java to $MAIN_ACTIVITY_DIR"

      # ── Firebase Cloud Messaging config ──────────────────────────
      - name: Decode google-services.json into android/app/
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Add Google Services Gradle plugin
        run: |
          sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

      - name: Copy web assets
        run: npx cap copy android

      - name: Sync
        run: npx cap sync android

      - name: Update Target SDK and Version
        run: |
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/g' android/variables.gradle
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 34/g' android/variables.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ steps.pkgversion.outputs.version }}\"/" android/app/build.gradle

      - name: Allow mixed content in WebView
        run: |
          sed -i 's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml || true
          grep -q 'usesCleartextTraffic' android/app/src/main/AndroidManifest.xml || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      # ── Enable predictive-back callback support (Android 13+/15) ──
      - name: Enable OnBackInvokedCallback in manifest
        run: |
          grep -q 'android:enableOnBackInvokedCallback' android/app/src/main/AndroidManifest.xml || \
          sed -i 's/<application/<application android:enableOnBackInvokedCallback="true"/' android/app/src/main/AndroidManifest.xml

      # ── Permissions ─────────────────────────────────────────────
      - name: Add Storage, Media, and Notification Permissions
        run: |
          PERMISSIONS="<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"\/>\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"\/>\n    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\"\/>\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"\/>\n\n    <application"
          sed -i "s/<application/$PERMISSIONS/" android/app/src/main/AndroidManifest.xml

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Patch release signing config into build.gradle
        run: python3 patch_gradle_signing.py

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RankScoreMaster-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Build Signed AAB (Play Store bundle)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: RankScoreMaster-Signed-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
